name: the-songs-between-us

services:
  web:
    image: the-songs-between-us:local
    build:
      context: .
      target: runner
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "${APP_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    stop_grace_period: 10s
